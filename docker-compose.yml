version: '3.8'

services:
  ros2_agv_sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros:humble-nav2
    container_name: ros2_agv_sim
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./:/workspace
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    command: ["/workspace/start_sim.sh"]
